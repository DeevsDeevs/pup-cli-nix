name: Check for Updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific Pup version to update to, with or without leading v'
        required: false

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-pup
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Check version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          CURRENT_VERSION=$(python3 - <<'PY'
          import re
          text = open('package.nix').read()
          print(re.search(r'\bversion\s*=\s*"([^"]+)"', text).group(1))
          PY
          )

          if [ -n "$REQUESTED_VERSION" ]; then
            LATEST_VERSION="$REQUESTED_VERSION"
            LATEST_VERSION="${LATEST_VERSION#v}"
          else
            LATEST_VERSION=$(gh api repos/DataDog/pup/releases/latest --jq .tag_name)
            LATEST_VERSION="${LATEST_VERSION#v}"
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Latest version:  $LATEST_VERSION"

          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            {
              echo "update_needed=true"
              echo "current_version=$CURRENT_VERSION"
              echo "new_version=$LATEST_VERSION"
            } >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update package
        if: steps.check.outputs.update_needed == 'true'
        env:
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
        run: ./scripts/update.sh --version "$NEW_VERSION" --no-build

      - name: Create pull request
        id: pr
        if: steps.check.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update pup to ${{ steps.check.outputs.new_version }}"
          title: "chore: update pup to ${{ steps.check.outputs.new_version }}"
          body: |
            Updates Datadog Pup from `${{ steps.check.outputs.current_version }}` to `${{ steps.check.outputs.new_version }}`.

            Generated by `.github/workflows/update.yml` using `scripts/update.sh`.
            Linux/macOS build and smoke tests run as **Build** checks on this PR, approved by the [updater workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          branch: update-pup
          delete-branch: true
          labels: |
            dependencies
            automated

      # Bot-opened PRs leave their pull_request Build run awaiting approval, and
      # dispatched runs don't count as PR checks, so approve the PR's own run.
      - name: Approve Build run on update PR
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          for _ in $(seq 18); do
            run_ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&status=action_required&head_sha=$HEAD_SHA" --jq '.workflow_runs[].id')
            [ -n "$run_ids" ] && break
            sleep 10
          done
          if [ -z "$run_ids" ]; then
            echo "No Build run awaiting approval for $HEAD_SHA"
            exit 0
          fi
          for run_id in $run_ids; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
            echo "Approved run $run_id"
          done

      - name: Summary
        if: always()
        env:
          UPDATE_NEEDED: ${{ steps.check.outputs.update_needed }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Pup update check"
            echo ""
            if [ "$JOB_STATUS" != "success" ]; then
              echo "Update check failed; see the workflow logs."
            elif [ "$UPDATE_NEEDED" = "true" ]; then
              echo "Update PR for Pup $NEW_VERSION: $PR_URL"
              echo "Linux/macOS Build checks run on the PR."
            else
              echo "Already up to date."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
