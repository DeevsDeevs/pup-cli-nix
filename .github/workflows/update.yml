name: Check for Updates

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific Pup version to update to, with or without leading v'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Check version
        id: check
        run: |
          CURRENT_VERSION=$(python3 - <<'PY'
          import re
          text = open('package.nix').read()
          print(re.search(r'\bversion\s*=\s*"([^"]+)"', text).group(1))
          PY
          )

          if [ -n "${{ github.event.inputs.version }}" ]; then
            LATEST_VERSION="${{ github.event.inputs.version }}"
            LATEST_VERSION="${LATEST_VERSION#v}"
          else
            LATEST_VERSION=$(python3 - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('https://api.github.com/repos/datadog-labs/pup/releases/latest') as r:
              print(json.load(r)['tag_name'].removeprefix('v'))
          PY
          )
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Latest version:  $LATEST_VERSION"

          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            {
              echo "update_needed=true"
              echo "current_version=$CURRENT_VERSION"
              echo "new_version=$LATEST_VERSION"
            } >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update package
        if: steps.check.outputs.update_needed == 'true'
        run: ./scripts/update.sh --version "${{ steps.check.outputs.new_version }}"

      - name: Create pull request
        if: steps.check.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update pup to ${{ steps.check.outputs.new_version }}"
          title: "chore: update pup to ${{ steps.check.outputs.new_version }}"
          body: |
            Updates Datadog Pup from `${{ steps.check.outputs.current_version }}` to `${{ steps.check.outputs.new_version }}`.

            Generated by `.github/workflows/update.yml` using `scripts/update.sh`.
          branch: update-pup-${{ steps.check.outputs.new_version }}
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Summary
        if: always()
        run: |
          {
            echo "## Pup update check"
            echo ""
            if [ "${{ steps.check.outputs.update_needed }}" = "true" ]; then
              echo "Update PR created for Pup ${{ steps.check.outputs.new_version }}."
            else
              echo "Already up to date."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
