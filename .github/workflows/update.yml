name: Check for Updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific Pup version to update to, with or without leading v'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pup
  cancel-in-progress: false

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      head-sha: ${{ steps.pr.outputs.pull-request-head-sha }}

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Check version
        id: check
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          CURRENT_VERSION=$(python3 - <<'PY'
          import re
          text = open('package.nix').read()
          print(re.search(r'\bversion\s*=\s*"([^"]+)"', text).group(1))
          PY
          )

          if [ -n "$REQUESTED_VERSION" ]; then
            LATEST_VERSION="$REQUESTED_VERSION"
            LATEST_VERSION="${LATEST_VERSION#v}"
          else
            LATEST_VERSION=$(python3 - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('https://api.github.com/repos/DataDog/pup/releases/latest') as r:
              print(json.load(r)['tag_name'].removeprefix('v'))
          PY
          )
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Latest version:  $LATEST_VERSION"

          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            {
              echo "update_needed=true"
              echo "current_version=$CURRENT_VERSION"
              echo "new_version=$LATEST_VERSION"
            } >> "$GITHUB_OUTPUT"
          else
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update package
        if: steps.check.outputs.update_needed == 'true'
        env:
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
        run: ./scripts/update.sh --version "$NEW_VERSION" --no-build

      - name: Create pull request
        id: pr
        if: steps.check.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update pup to ${{ steps.check.outputs.new_version }}"
          title: "chore: update pup to ${{ steps.check.outputs.new_version }}"
          body: |
            Updates Datadog Pup from `${{ steps.check.outputs.current_version }}` to `${{ steps.check.outputs.new_version }}`.

            Generated by `.github/workflows/update.yml` using `scripts/update.sh`.
            Linux/macOS build and smoke tests run in the linked [updater workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          branch: update-pup
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Summary
        if: always()
        env:
          UPDATE_NEEDED: ${{ steps.check.outputs.update_needed }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Pup update check"
            echo ""
            if [ "$JOB_STATUS" != "success" ]; then
              echo "Update check failed; see the workflow logs."
            elif [ "$UPDATE_NEEDED" = "true" ]; then
              echo "Update PR for Pup $NEW_VERSION: $PR_URL"
              echo "See the validation jobs for Linux/macOS build results."
            else
              echo "Already up to date."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  validate-update:
    needs: check-update
    if: needs.check-update.outputs.head-sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.check-update.outputs.head-sha }}
