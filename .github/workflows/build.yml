name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Exact update PR commit to build'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Show flake outputs
        run: nix flake show

      - name: Build Pup
        run: nix build .#pup --print-build-logs

      - name: Smoke test
        run: |
          test -x ./result/bin/pup
          ./result/bin/pup --version
          ./result/bin/pup --help >/dev/null
